<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How It Felt - Project Proposal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1c1a16; overflow: hidden; font-family: Helvetica, Arial, sans-serif; }
  .deck { position: relative; width: 100vw; height: 100vh; }
  .slide { display: none; width: 100%; height: 100%; position: relative; }
  .slide.active { display: block; }
  .slide > img.board { width: 100%; height: 100%; object-fit: contain; background: #f4f0e6; }
  .demo {
    position: absolute;
    left: 59.9%; top: 31.48%; width: 34.375%;
    display: none;
  }
  .slide.active .demo { display: block; }
  .hint {
    position: fixed; bottom: 12px; right: 16px; color: #8a8272;
    font-size: 12px; letter-spacing: 0.15em;
  }
</style>
</head>
<body>
<div class="deck">
  <div class="slide active"><img class="board" src="deck/slide1.png" alt="cover"></div>
  <div class="slide">
    <img class="board" src="deck/slide2.png" alt="the idea">
    <img class="demo" src="glowtide.gif" alt="typing bubble demo">
  </div>
  <div class="slide"><img class="board" src="deck/slide3.png" alt="exhibits"></div>
  <div class="slide"><img class="board" src="deck/slide4.png" alt="references"></div>
  <div class="slide"><img class="board" src="deck/slide5.png" alt="how it works"></div>
  <div class="slide"><img class="board" src="deck/slide6.png" alt="closing"></div>
</div>
<div class="hint">arrow keys to move</div>
<script>
  const slides = document.querySelectorAll('.slide');
  let i = 0;
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('active', k === i));
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
  document.addEventListener('click', () => show(i + 1));
</script>
</body>
</html>
